; Isolated host-health integration configuration.
; This intentionally uses only /tmp state and never requests privileged hardware.

[general]
pid_file = /tmp/lightnvr-test/lightnvr.pid
log_file = /tmp/lightnvr-test/lightnvr.log
log_level = 3
syslog_enabled = false
syslog_ident = lightnvr-health-test
syslog_facility = LOG_USER

[health]
enabled = true
profile = balanced
fast_interval_seconds = 5
normal_interval_seconds = 15
slow_interval_seconds = 60
device_interval_seconds = 300
write_probe_enabled = false
hardware_provider = disabled
presence_interval_seconds = 15
incident_retention_days = 7

[storage]
path = /tmp/lightnvr-test/recordings
max_size = 0
retention_days = 1
auto_delete_oldest = true
record_mp4_directly = false
mp4_path = /tmp/lightnvr-test/recordings/mp4
mp4_segment_duration = 60
mp4_retention_days = 1

[database]
path = /tmp/lightnvr-test/lightnvr.db
startup_check = quick

[web]
bind_ip = 127.0.0.1
port = 18080
root = ./web/dist
auth_enabled = true
username = admin
password = admin
auth_timeout_hours = 1
web_thread_pool_size = 4

[streams]
max_streams = 1

[models]
path = /tmp/lightnvr-test/models

[memory]
buffer_size = 256
use_swap = false
swap_file = /tmp/lightnvr-test/swap
swap_size = 0

[hardware]
hw_accel_enabled = false
hw_accel_device =

[go2rtc]
enabled = false
config_dir = /tmp/lightnvr-test/go2rtc

[mqtt]
enabled = true
broker_host = 127.0.0.1
broker_port = 18884
client_id = lightnvr-health-t24
topic_prefix = lightnvr/t24
tls_enabled = false
keepalive = 5
qos = 1
retain = false
ha_discovery = false
ha_snapshot_interval = 0
