name: Static Analysis

on:
  push:
    branches: [main]
  pull_request:
    # Keep the same gates on the explicitly stacked hardening PRs.
    branches: [main, 'codex/hardening-*']
  workflow_dispatch:

permissions:
  contents: read

# A generated Rust follow-up queues behind its source run instead of cancelling
# work that just passed. Other pushes and PR updates still supersede older runs.
# Match commit metadata: deploy-key pushes are attributed to the key owner.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: >-
    ${{ !(github.event_name == 'push' && github.ref == 'refs/heads/main' && github.event.head_commit.author.email == '41898282+github-actions[bot]@users.noreply.github.com' && startsWith(github.event.head_commit.message, 'lightnvr-rs: regenerate from C')) }}

jobs:
  web-jsx-a11y:
    name: Web JSX accessibility lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json
      - name: Install web dependencies
        run: npm ci --prefix web
      - name: Install root contract and browser test types
        run: npm ci
      - name: Validate deterministic API contracts
        run: |
          npm run contracts:lint
          npm run contracts:check
          npm run contracts:test-tools
          npm run contracts:typecheck
          node --test tests/contracts/fixtures/schema/validate.mjs
      - name: Type-check root integration and load tooling
        run: npm run test:typecheck
      - name: Type-check web UI
        run: npm run typecheck --prefix web
      - name: Lint web UI
        run: npm run lint --prefix web

  clang-tidy:
    name: clang-tidy
    runs-on: ubuntu-latest
    container: debian:sid-slim
    timeout-minutes: 30

    steps:
      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y \
            git build-essential cmake pkg-config clang-tidy \
            libavcodec-dev libavformat-dev libavutil-dev libswscale-dev libavfilter-dev \
            libsqlite3-dev libuv1-dev libllhttp-dev libcurl4-openssl-dev \
            libcjson-dev libmbedtls-dev libmosquitto-dev

      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: false

      - name: Checkout FAAC submodule
        run: |
          # Keep optional go2rtc/LiteRT sources out of these builds.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git submodule update --init --depth 1 third_party/faac

      - name: Generate compile_commands.json
        run: |
          mkdir -p build && cd build
          cmake .. \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DENABLE_SOD=OFF \
            -DENABLE_GO2RTC=OFF \
            -DBUILD_TESTS=OFF
          # Copy to project root for clang-tidy
          cp compile_commands.json ..

      - name: Run clang-tidy
        run: |
          echo "::group::clang-tidy version"
          clang-tidy --version
          echo "::endgroup::"

          # Find all C source files under src/, excluding third-party code
          find src/ -name '*.c' -not -path '*/sod/*' -not -path '*/ezxml/*' | sort > /tmp/source_files.txt
          echo "Scanning $(wc -l < /tmp/source_files.txt) source files..."

          # Run clang-tidy (non-blocking: always exit 0)
          set +e
          clang-tidy \
            -p compile_commands.json \
            $(cat /tmp/source_files.txt) \
            --quiet \
            2>&1 | tee clang-tidy-report.txt
          set -e

          # Count warnings
          WARNINGS=$(grep -c "warning:" clang-tidy-report.txt || true)
          ERRORS=$(grep -c "error:" clang-tidy-report.txt || true)
          echo "## clang-tidy Results" >> $GITHUB_STEP_SUMMARY
          echo "- **Warnings**: ${WARNINGS}" >> $GITHUB_STEP_SUMMARY
          echo "- **Errors**: ${ERRORS}" >> $GITHUB_STEP_SUMMARY

      - name: Upload clang-tidy report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: clang-tidy-report
          path: clang-tidy-report.txt
          retention-days: 30

  cppcheck:
    name: cppcheck
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: false

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cppcheck

      - name: Run cppcheck
        run: |
          echo "::group::cppcheck version"
          cppcheck --version
          echo "::endgroup::"

          # Run cppcheck with XML output (non-blocking: --error-exitcode=0)
          cppcheck \
            --enable=all \
            --suppress=missingIncludeSystem \
            --suppress=unusedFunction \
            --inline-suppr \
            --error-exitcode=0 \
            --xml \
            --xml-version=2 \
            -I include/ \
            src/ \
            2> cppcheck-report.xml

          # Also generate a human-readable report
          cppcheck \
            --enable=all \
            --suppress=missingIncludeSystem \
            --suppress=unusedFunction \
            --inline-suppr \
            --error-exitcode=0 \
            --template='{file}:{line}: {severity}: {message} [{id}]' \
            -I include/ \
            src/ \
            2> cppcheck-report.txt

          # Summary
          ERRORS=$(grep -c 'severity="error"' cppcheck-report.xml || true)
          WARNINGS=$(grep -c 'severity="warning"' cppcheck-report.xml || true)
          STYLE=$(grep -c 'severity="style"' cppcheck-report.xml || true)
          PERF=$(grep -c 'severity="performance"' cppcheck-report.xml || true)
          echo "## cppcheck Results" >> $GITHUB_STEP_SUMMARY
          echo "- **Errors**: ${ERRORS}" >> $GITHUB_STEP_SUMMARY
          echo "- **Warnings**: ${WARNINGS}" >> $GITHUB_STEP_SUMMARY
          echo "- **Style**: ${STYLE}" >> $GITHUB_STEP_SUMMARY
          echo "- **Performance**: ${PERF}" >> $GITHUB_STEP_SUMMARY

      - name: Upload cppcheck reports
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: cppcheck-reports
          path: |
            cppcheck-report.xml
            cppcheck-report.txt
          retention-days: 30

