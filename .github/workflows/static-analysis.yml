name: Static Analysis
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  security-events: write

jobs:
  web:
    name: ESLint findings
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      REPORT_DIR: build/analysis/eslint
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --prefix web
      - name: Capture ESLint JSON and execution provenance
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          spec = {'scanner_id':'eslint-web', 'version_command':['web/node_modules/.bin/eslint','--version'],
            'commands':[{'argv':['./node_modules/.bin/eslint','js','--format','json'], 'cwd':'web',
              'stdout_report':'eslint.json','reports':['eslint.json'],'accepted_exit_codes':[0,1]}],
            'scope':{'kind':'eslint-json','report':'eslint.json'}}
          Path('build').mkdir(exist_ok=True)
          Path('build/eslint-spec.json').write_text(json.dumps(spec))
          PY
          python3 scripts/quality/scanner_run.py --spec build/eslint-spec.json --reports "$REPORT_DIR" --expected-revision "$GITHUB_SHA"
      - name: Check scoped ESLint findings
        if: always()
        run: python3 scripts/quality/findings_lane.py --scanner eslint-web --reports "$REPORT_DIR" --expected-revision "$GITHUB_SHA" --json-out "$REPORT_DIR/lane-result.json"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: analysis-eslint
          path: ${{ env.REPORT_DIR }}
          if-no-files-found: error
          retention-days: 30

  dependencies:
    name: npm audit (${{ matrix.project }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        project: [root, web]
    env:
      PROJECT: ${{ matrix.project }}
      REPORT_DIR: build/analysis/npm-${{ matrix.project }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - name: Audit production and complete dependency graphs
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          project = os.environ['PROJECT']
          commands = []
          for variant in ('all','prod'):
            report = f'{project}-audit-{variant}.json'
            command = {'argv':['npm','audit','--package-lock-only','--json'] + (['--omit=dev'] if variant == 'prod' else []),
              'reports':[report], 'stdout_report':report, 'accepted_exit_codes':[0,1]}
            if project == 'web': command['cwd'] = 'web'
            commands.append(command)
          spec = {'scanner_id':f'npm-audit-{project}', 'version_command':['npm','--version'],
            'commands':commands, 'scope':{'kind':'npm-lockfiles'}}
          Path('build').mkdir(exist_ok=True)
          Path('build/npm-spec.json').write_text(json.dumps(spec))
          PY
          python3 scripts/quality/scanner_run.py --spec build/npm-spec.json --reports "$REPORT_DIR" --expected-revision "$GITHUB_SHA"
      - name: Check scoped dependency findings
        if: always()
        run: python3 scripts/quality/findings_lane.py --scanner "npm-audit-$PROJECT" --reports "$REPORT_DIR" --expected-revision "$GITHUB_SHA" --json-out "$REPORT_DIR/lane-result.json"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: analysis-npm-${{ matrix.project }}
          path: ${{ env.REPORT_DIR }}
          if-no-files-found: error
          retention-days: 30

  native:
    name: Native analysis (${{ matrix.scanner }})
    runs-on: ubuntu-latest
    container: debian:sid-slim
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        scanner: [clang-tidy, cppcheck]
    defaults:
      run:
        shell: bash
    env:
      SCANNER_ID: ${{ matrix.scanner }}
      REPORT_DIR: build/analysis/${{ matrix.scanner }}
    steps:
      - name: Install native analysis dependencies
        run: |
          apt-get update
          apt-get install -y git python3 build-essential cmake pkg-config clang-tidy cppcheck \
            libavcodec-dev libavformat-dev libavutil-dev libswscale-dev libavfilter-dev \
            libsqlite3-dev libuv1-dev libllhttp-dev libcurl4-openssl-dev \
            libcjson-dev libmbedtls-dev libmosquitto-dev
      - uses: actions/checkout@v6
        with:
          submodules: false
      - name: Configure explicit analysis profile
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git submodule update --init --depth 1 third_party/faac
          cmake -S . -B build/analysis-native -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -DENABLE_SOD=OFF -DENABLE_GO2RTC=OFF \
            -DENABLE_LITERT=OFF -DENABLE_SENTRY=OFF -DENABLE_SSL=OFF -DENABLE_MQTT=ON -DBUILD_TESTS=OFF
      - name: Analyze with captured exit and source scope
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          root = Path.cwd()
          sid = os.environ['SCANNER_ID']
          report_dir = os.environ['REPORT_DIR']
          if sid == 'clang-tidy':
            entries = json.loads(Path('build/analysis-native/compile_commands.json').read_text())
            files = sorted({Path(row['file']).resolve().relative_to(root).as_posix() for row in entries
              if Path(row['file']).resolve().is_relative_to(root / 'src')
              and not any(part in ('sod','ezxml') for part in Path(row['file']).parts)})
            report = 'clang-tidy-report.txt'
            # ClangTool itself emits [i/N] Processing file on stderr. Capture
            # both streams without a pipeline; no fabricated progress markers.
            command = {'argv':['clang-tidy','-p','build/analysis-native','--quiet'],
              'stdout_report':report, 'stderr_to_stdout':True, 'reports':[report],
              'append_scope_files':True, 'timeout_seconds':2100}
            scope = {'kind':'invocation-files','files':files}
          else:
            report = 'cppcheck-report.xml'
            command = {'argv':['cppcheck','--project=build/analysis-native/compile_commands.json',
              '--file-filter=*/src/*','--enable=all','--suppress=missingIncludeSystem',
              '--suppress=unusedFunction','--inline-suppr','--error-exitcode=2','--xml','--xml-version=2',
              '--output-file=' + str(root / report_dir / report)],
              'reports':[report], 'accepted_exit_codes':[0,2], 'timeout_seconds':2100}
            scope = {'kind':'cppcheck-progress','report':'logs/cppcheck-0.stdout.log'}
          spec = {'scanner_id':sid,'version_command':[sid,'--version'],'commands':[command],'scope':scope}
          Path('build/native-spec.json').write_text(json.dumps(spec))
          PY
          python3 scripts/quality/scanner_run.py --spec build/native-spec.json --reports "$REPORT_DIR" --expected-revision "$GITHUB_SHA"
      - name: Check scoped native findings
        if: always()
        run: python3 scripts/quality/findings_lane.py --scanner "$SCANNER_ID" --reports "$REPORT_DIR" --expected-revision "$GITHUB_SHA" --json-out "$REPORT_DIR/lane-result.json"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: analysis-${{ matrix.scanner }}
          path: ${{ env.REPORT_DIR }}
          if-no-files-found: error
          retention-days: 30

  codeql:
    uses: ./.github/workflows/codeql-analysis.yml
  container:
    uses: ./.github/workflows/container-scan.yml

  analysis-coverage:
    name: Analysis coverage and findings
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [web, dependencies, native, codeql, container]
    if: always()
    env:
      INCOMING_DIR: build/analysis-incoming
      REPORT_DIR: build/analysis-combined
    steps:
      - uses: actions/checkout@v6
      - name: Download only this workflow run's evidence
        uses: actions/download-artifact@v8
        with:
          pattern: analysis-*
          path: ${{ env.INCOMING_DIR }}
      - name: Merge same-run scanner manifests
        run: |
          python3 - <<'PY'
          import json, os, shutil
          from pathlib import Path, PurePosixPath
          incoming, output = Path(os.environ['INCOMING_DIR']), Path(os.environ['REPORT_DIR'])
          output.mkdir(parents=True, exist_ok=False)
          merged = {'schema_version':1,'revision':os.environ['GITHUB_SHA'],'scanners':{}}
          def portable(value):
            p = PurePosixPath(value)
            if not value or p.is_absolute() or '\\' in value or any(x in ('.','..','') for x in value.split('/')):
              raise ValueError('Unsafe artifact evidence path')
            return value
          for artifact in sorted(incoming.iterdir() if incoming.exists() else []):
            if artifact.is_symlink() or not artifact.is_dir(): raise ValueError('Invalid artifact directory')
            if any(p.is_symlink() for p in artifact.rglob('*')): raise ValueError('Symlink in artifact')
            manifest_path = artifact / 'run-manifest.json'
            if not manifest_path.exists(): continue  # Full checker reports missing scanner; never an empty pass.
            manifest = json.loads(manifest_path.read_text())
            if manifest.get('schema_version') != 1 or manifest.get('revision') != merged['revision']:
              raise ValueError('Artifact has wrong schema or revision')
            prefix = portable(artifact.name) + '/'
            for sid, entry in manifest['scanners'].items():
              if sid in merged['scanners']: raise ValueError('Duplicate scanner evidence')
              entry['reports'] = [prefix + portable(p) for p in entry['reports']]
              entry['report_sha256'] = {prefix + portable(p): h for p,h in entry['report_sha256'].items()}
              scope = entry.get('scope') or {}
              if 'evidence_sha256' in scope:
                scope['evidence_sha256'] = {prefix + portable(p): h for p,h in scope['evidence_sha256'].items()}
              merged['scanners'][sid] = entry
            shutil.copytree(artifact, output / artifact.name)
          (output / 'run-manifest.json').write_text(json.dumps(merged,indent=2) + '\n')
          PY
      - name: Enforce full expected coverage and findings policy
        if: always()
        run: python3 scripts/quality/findings.py --check --reports "$REPORT_DIR" --expected-revision "$GITHUB_SHA" --json-out "$REPORT_DIR/policy-result.json"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: findings-policy-evidence
          path: ${{ env.REPORT_DIR }}
          if-no-files-found: error
          retention-days: 30
