name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    # Keep the same gates on the explicitly stacked hardening PRs.
    branches: [main, 'codex/hardening-*']
  schedule:
    # Run weekly on Mondays at 06:00 UTC to catch new CVE patterns
    - cron: '0 6 * * 1'
  workflow_dispatch:

# A generated Rust follow-up queues behind its source run instead of cancelling
# work that just passed. Other pushes and PR updates still supersede older runs.
# Match commit metadata: deploy-key pushes are attributed to the key owner.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: >-
    ${{ !(github.event_name == 'push' && github.ref == 'refs/heads/main' && github.event.head_commit.author.email == '41898282+github-actions[bot]@users.noreply.github.com' && startsWith(github.event.head_commit.message, 'lightnvr-rs: regenerate from C')) }}

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    container: debian:sid-slim
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix:
        language: ['c-cpp']

    steps:
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y \
            git build-essential cmake pkg-config \
            libavcodec-dev libavformat-dev libavutil-dev libswscale-dev libavfilter-dev \
            libsqlite3-dev libuv1-dev libllhttp-dev libcurl4-openssl-dev \
            libcjson-dev libmbedtls-dev libmosquitto-dev

      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: false

      - name: Checkout FAAC submodule
        run: |
          # Keep optional go2rtc/LiteRT sources out of these builds.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git submodule update --init --depth 1 third_party/faac

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          # Use extended queries for more thorough security analysis
          queries: security-extended

      - name: Build for CodeQL
        run: |
          mkdir -p build && cd build
          cmake .. \
            -DCMAKE_BUILD_TYPE=Release \
            -DENABLE_SOD=OFF \
            -DENABLE_GO2RTC=OFF \
            -DBUILD_TESTS=OFF
          make -j$(nproc)

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"

