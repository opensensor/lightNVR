name: Documentation Links

# Documentation that points at files which do not exist is a recurring failure mode
# (see #492): nothing builds it, no test covers it, and the first person to notice is a
# user following a dead link. scripts/check_docs_links.py catches the two classes we can
# check mechanically - relative links to missing files, and referenced repo paths that
# are gone. Run it locally the same way.

on:
  push:
    branches: [main]
    paths:
      - '**/*.md'
      - 'scripts/check_docs_links.py'
      - '.github/workflows/docs-link-check.yml'
  pull_request:
    paths:
      - '**/*.md'
      - 'scripts/check_docs_links.py'
      - '.github/workflows/docs-link-check.yml'
  workflow_dispatch:

jobs:
  links:
    name: Check documentation links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check links and referenced paths
        run: python3 scripts/check_docs_links.py
