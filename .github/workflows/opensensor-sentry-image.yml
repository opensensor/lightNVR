name: OpenSensor monitored recorder image
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish an immutable hosted image (does not deploy)
        type: boolean
        default: false
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SENTRY_ORG: opensensor-engineering
      SENTRY_PROJECT: lightnvr
      SENTRY_RELEASE: lightnvr@${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: inputs.publish
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          target: sentry-debug-files
          outputs: type=local,dest=sentry-debug-files
          build-args: |
            ENABLE_SENTRY=ON
            GIT_COMMIT=${{ github.sha }}
            SENTRY_RELEASE=${{ env.SENTRY_RELEASE }}
            VITE_SENTRY_DSN=https://90ad2a70a8fc58663e241c66df45831c@o4512337837686784.ingest.us.sentry.io/4512337997791232
          secrets: |
            sentry_auth_token=${{ secrets.OPENSENSOR_SENTRY_AUTH_TOKEN }}
          cache-from: type=gha,scope=opensensor-sentry
          cache-to: type=gha,scope=opensensor-sentry,mode=min
      - name: Upload native debug symbols and source context
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.OPENSENSOR_SENTRY_AUTH_TOKEN }}
        run: npx --yes @sentry/cli@3.3.0 debug-files upload --include-sources sentry-debug-files
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          target: runtime
          push: ${{ inputs.publish }}
          tags: ghcr.io/opensensor/lightnvr:opensensor-sentry-${{ github.sha }}
          build-args: |
            ENABLE_SENTRY=ON
            GIT_COMMIT=${{ github.sha }}
            SENTRY_RELEASE=${{ env.SENTRY_RELEASE }}
            VITE_SENTRY_DSN=https://90ad2a70a8fc58663e241c66df45831c@o4512337837686784.ingest.us.sentry.io/4512337997791232
          secrets: |
            sentry_auth_token=${{ secrets.OPENSENSOR_SENTRY_AUTH_TOKEN }}
          cache-from: type=gha,scope=opensensor-sentry
