name: Cancel merged PR runs

# PR workflows share a concurrency key between their normal runs and the
# merged pull_request event. GitHub cancels the old run when it queues that
# event, without waiting for a runner. This workflow catches remaining runs
# such as CLA and Code Quality once a runner becomes available.
#
# pull_request_target is used so the token can cancel runs for PRs from forks
# too. This workflow never checks out or executes PR code, and the branch name
# reaches the shell only through an environment variable.

on:
  pull_request_target:
    types: [closed]

permissions:
  actions: write

jobs:
  cancel:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Cancel queued and in-progress runs for the PR head
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          SELF_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          # A fork's branch may be named main; match its repository too.
          # Code Quality runs use refs/pull/N/head instead of the head branch.
          ids=$(
            gh api -X GET "repos/$REPO/actions/runs" \
              -f branch="$HEAD_REF" -F per_page=100 --paginate |
              jq -r --arg repo "$HEAD_REPO" --argjson self "$SELF_RUN_ID" \
                '.workflow_runs[] | select(.status != "completed")
                 | select(.head_repository.full_name == $repo)
                 | select(.id != $self) | .id'
            gh api -X GET "repos/$REPO/actions/runs" \
              -f branch="refs/pull/$PR_NUMBER/head" -F per_page=100 --paginate |
              jq -r --arg ref "refs/pull/$PR_NUMBER/head" --argjson self "$SELF_RUN_ID" \
                '.workflow_runs[] | select(.status != "completed")
                 | select(.head_branch == $ref) | select(.id != $self) | .id'
          )
          ids=$(printf '%s\n' "$ids" | sed '/^$/d' | sort -u)
          if [ -z "$ids" ]; then
            echo "No active runs for $HEAD_REPO:$HEAD_REF."
            exit 0
          fi
          for id in $ids; do
            # A run can finish between listing and cancelling; that is fine.
            if gh api -X POST "repos/$REPO/actions/runs/$id/cancel" --silent; then
              echo "Cancelled run $id"
            else
              echo "Could not cancel run $id (probably already finished)"
            fi
          done
