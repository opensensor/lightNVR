name: lightnvr-public-issue-kimi
agent: opencode
size: mars-2vcpu-4gb
idle_timeout: 30m
repos:
  - opensensor/lightNVR
env:
  HARNESS_INFERENCE_MODEL: kimi-k3
secrets:
  HARNESS_INFERENCE_API_KEY: ${HARNESS_INFERENCE_API_KEY}
  GIT_DEPLOY_KEY_B64: ${GIT_DEPLOY_KEY_B64}
permissions:
  default: allow
