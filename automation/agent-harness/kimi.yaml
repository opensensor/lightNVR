name: lightnvr-public-issue-kimi
agent: opencode
size: mars-2vcpu-4gb
idle_timeout: 30m
repos:
  - opensensor/lightNVR
env:
  HARNESS_INFERENCE_MODEL: kimi-k3
secrets:
  HARNESS_INFERENCE_API_KEY: ${HARNESS_INFERENCE_API_KEY}
  GITHUB_TOKEN: ${GITHUB_TOKEN}
permissions:
  default: ask
  rules:
    - tool: file.read
      action: allow
