# Strategic merge patch for deployments with an existing archive-files init
# container and archive-file-refresh sidecar. Preserve their atomic publication
# commands, mounts, and resource limits. Match these names to your deployment.
# Kubernetes fsGroup makes projected Secrets readable to the helper; the helper
# must own its ordinary 0600 output files as the recorder's UID (10001).
# Applying this patch replaces the pod, rebuilding the memory-backed files with
# the correct ownership. Never relax private-file permissions to group-readable.
spec:
  template:
    spec:
      securityContext:
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
      initContainers:
        - name: archive-files
          securityContext:
            runAsUser: 10001
            runAsGroup: 10001
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault
      containers:
        - name: archive-file-refresh
          securityContext:
            runAsUser: 10001
            runAsGroup: 10001
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault
