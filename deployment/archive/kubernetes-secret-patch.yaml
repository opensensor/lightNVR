# Strategic merge patch for an existing Deployment named lightnvr.
# Keep the existing config and hot PVC mounts. Build/pin an image containing this
# feature before applying. Recorder images use UID/GID 10001; keep every helper
# that publishes private archive files on the same UID as the recorder.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lightnvr
spec:
  replicas: 1
  strategy:
    type: Recreate
    rollingUpdate: null
  template:
    spec:
      terminationGracePeriodSeconds: 90
      securityContext:
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
      initContainers:
        - name: archive-credentials
          image: busybox:1.37.0
          command:
            - /bin/sh
            - -ec
            - |
              umask 077
              cp /projected/credentials.json /mounted/instance
              chmod 600 /mounted/instance
          securityContext:
            runAsUser: 10001
            runAsGroup: 10001
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: archive-secret
              mountPath: /projected
              readOnly: true
            - name: archive-credentials
              mountPath: /mounted
      containers:
        - name: lightnvr
          securityContext:
            runAsUser: 10001
            runAsGroup: 10001
            runAsNonRoot: true
          env:
            - name: LIGHTNVR_ARCHIVE_CREDENTIALS_DIR
              value: /run/lightnvr/archive-credentials
            - name: LIGHTNVR_ARCHIVE_CACHE_MB
              value: "2048"
          volumeMounts:
            - name: archive-credentials
              mountPath: /run/lightnvr/archive-credentials
              readOnly: true
      volumes:
        - name: archive-secret
          secret:
            secretName: lightnvr-archive
            defaultMode: 256 # octal 0400
        - name: archive-credentials
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
