# Strategic merge patch for an existing Deployment named lightnvr.
# Keep the existing config and hot PVC mounts. Build/pin an image containing this
# feature before applying. This example assumes the existing image runs as root;
# change chown/runAsUser together when using a different application UID.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lightnvr
spec:
  replicas: 1
  strategy:
    type: Recreate
    rollingUpdate: null
  template:
    spec:
      terminationGracePeriodSeconds: 90
      initContainers:
        - name: archive-credentials
          image: busybox:1.37.0
          command:
            - /bin/sh
            - -ec
            - |
              umask 077
              cp /projected/credentials.json /mounted/instance
              chmod 600 /mounted/instance
              chown 0:0 /mounted/instance
          securityContext:
            runAsUser: 0
          volumeMounts:
            - name: archive-secret
              mountPath: /projected
              readOnly: true
            - name: archive-credentials
              mountPath: /mounted
      containers:
        - name: lightnvr
          env:
            - name: LIGHTNVR_ARCHIVE_CREDENTIALS_DIR
              value: /run/lightnvr/archive-credentials
            - name: LIGHTNVR_ARCHIVE_CACHE_MB
              value: "2048"
          volumeMounts:
            - name: archive-credentials
              mountPath: /run/lightnvr/archive-credentials
              readOnly: true
      volumes:
        - name: archive-secret
          secret:
            secretName: lightnvr-archive
            defaultMode: 256 # octal 0400
        - name: archive-credentials
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
